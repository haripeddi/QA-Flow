services:
  - type: web
    name: qa-flow-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: DATA_DIR
        value: /data
      - key: ALLOWED_ORIGIN
        sync: false
    disk:
      name: qa-flow-data
      mountPath: /data
      sizeGB: 1
